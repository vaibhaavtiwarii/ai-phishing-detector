<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 14px; margin: 0; color: #222; }
    h3 { margin: 0 0 8px 0; font-size: 15px; display: flex; align-items: center; justify-content: space-between; }
    .badge { padding: 8px 12px; border-radius: 6px; font-weight: bold; text-align: center; margin: 8px 0; font-size: 13px; }
    .safe { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .url { font-size: 11px; color: #666; word-break: break-all; margin-bottom: 6px; }
    details { margin-top: 10px; background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 6px; padding: 8px; font-size: 12px; }
    summary { font-weight: 600; cursor: pointer; color: #0066cc; outline: none; }
    ul { margin: 6px 0 0 16px; padding: 0; }
    li { margin-bottom: 4px; }
    .do-list { color: #155724; }
    .dont-list { color: #721c24; }
    button { width: 100%; margin-top: 10px; padding: 8px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; }
  </style>
</head>
<body>
  <h3>🛡️ AI Phishing Shield <span id="risk-pill" style="font-size:12px;"></span></h3>
  <div id="url-box" class="url">Analyzing current tab...</div>
  <div id="status-badge" class="badge">Auditing...</div>
  
  <details id="advisory-panel" style="display:none;">
    <summary>View Security Advisory & Actions</summary>
    <p id="summary-text" style="margin: 6px 0; font-size: 11px; color: #444;"></p>
    <strong style="color: #155724;">🟢 What To Do:</strong>
    <ul id="do-items" class="do-list"></ul>
    <strong style="color: #721c24; display:block; margin-top: 6px;">🔴 What NOT To Do:</strong>
    <ul id="dont-items" class="dont-list"></ul>
  </details>

  <button id="rescan-btn">Re-Audit Active Tab</button>
  <script src="popup.js"></script>
</body>
</html>
