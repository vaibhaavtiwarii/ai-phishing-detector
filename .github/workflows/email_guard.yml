name: 🛡️ Autonomous AI Gmail Guard

on:
  schedule:
    # Runs automatically every 30 minutes (24/7)
    - cron: '*/30 * * * *'
  # Allows you to trigger it manually anytime from GitHub UI
  workflow_dispatch:

jobs:
  audit-inbox:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn lightgbm joblib scipy

      - name: 🛡️ Execute AI Phishing Gateway
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: |
          python gmail_linker.py
